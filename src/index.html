<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Visuals</title>
  <style>
    body {
      margin: 0;
      background: #090914;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }
    h1 {
      font-size: 54px;
      color: #b77aff;
    }
    button, select {
      padding: 12px 20px;
      margin: 8px;
      border-radius: 8px;
      background: #6420b8;
      color: white;
      border: 1px solid #b77aff;
    }
    .panel {
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      background: #151527;
      border-radius: 15px;
    }
  </style>
</head>
<body>
  <h1>NOVA VISUALS</h1>
  <p>Твій Minecraft. Твій стиль.</p>

  <div class="panel">
    <h2>Вибір версії</h2>
    <select id="version">
      <option>1.21.11</option>
      <option>1.18.2</option>
    </select>
    <select id="loader">
      <option>Vanilla</option>
      <option>Fabric</option>
      <option>Forge</option>
      <option>OptiFine</option>
    </select>
    <br>
    <button onclick="alert('Запуск гри підключимо наступним етапом!')">
      ▶ ГРАТИ
    </button>
  </div>

  <p>Nova Visuals · Launcher Prototype</p>
</body>
</html>
