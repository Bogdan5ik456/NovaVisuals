
name: NovaVisuals - Code Check Only

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  code-check:
    name: Check source code without building
    runs-on: ubuntu-latest

    steps:
      - name: Download repository source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze code and configuration files
        uses: super-linter/super-linter@v9.0.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
