
---
name: Nova Visuals - Code Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  lint:
    name: Super-Linter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          LOG_LEVEL: INFO
          CSS_PRETTIER: true
          GITHUB_ACTIONS: true
          GITLEAKS: true
          HTML_PRETTIER: true
          JAVASCRIPT_ES: true
          JAVASCRIPT_PRETTIER: true
          JAVASCRIPT_STANDARD: true
          JSON_PRETTIER: true
          MARKDOWN_PRETTIER: true
          YAML_PRETTIER: true
