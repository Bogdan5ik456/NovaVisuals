
---
name: Build Nova Visuals Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check project files
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) {
            throw "ERROR: package.json not found"
          }
          if (!(Test-Path "package-lock.json")) {
            throw "ERROR: package-lock.json not found. npm ci cannot run."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Verify installer
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) {
            throw "ERROR: dist folder was not created"
          }

          $installer = Get-ChildItem "dist" -Filter "*.exe" -File

          if (!$installer) {
            throw "ERROR: No .exe installer found in dist"
          }

          $installer | ForEach-Object {
            Write-Host "Installer found: $($_.FullName)"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NovaVisuals-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
