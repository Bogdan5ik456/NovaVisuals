name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.4.2
      - name: Build Nova Visuals mod (Fabric 1.18.2)
        working-directory: fabric
        run: gradle build --no-daemon
      - name: Collect jar
        run: |
          mkdir mod-dist
          cp "$(ls fabric/build/libs/novavisuals-fabric-*.jar | grep -v -e '-sources' -e '-dev' | head -1)" mod-dist/NovaVisuals-fabric-1.18.2.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mod-dist
          path: mod-dist

  build:
    needs: mod
    if: ${{ !cancelled() }}   # лаунчер збирається, навіть якщо мод не зібрався
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mod-dist
          path: mod-dist
      - name: Ensure folders exist
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path mod-dist | Out-Null
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm install
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Nova Visuals ${{ env.VERSION }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
