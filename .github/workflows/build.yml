```yaml
---
name: Build Nova Visuals Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check package files
        shell: pwsh
        run: |
          if (-not (Test-Path "package.json")) {
            Write-Error "package.json not found"
            exit 1
          }

          if (-not (Test-Path "package-lock.json")) {
            Write-Error "package-lock.json not found"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Verify installer
        shell: pwsh
        run: |
          if (-not (Test-Path "dist")) {
            Write-Error "The dist directory was not created"
            exit 1
          }

          $installer = Get-ChildItem -Path "dist" -Filter "*.exe" -File

          if (-not $installer) {
            Write-Error "No Windows installer (.exe) found"
            exit 1
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NovaVisuals-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
```
