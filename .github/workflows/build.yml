
      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --package-lock-only --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to generate package-lock.json"
          }

          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install dependencies"
          }
