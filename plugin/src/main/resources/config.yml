# Текст після ніка. Кольори через &  (&d = фіолетовий)
suffix: " &dNV"

# Де показувати
show-in-tab: true        # список гравців (Tab)
show-in-chat: true       # у чаті після ніка
show-above-head: false   # над головою (через команду скорборду; може конфліктувати з плагінами команд)

# Як показувати NV у чаті:
#   auto        - (рекомендовано) плагін сам знаходить нік у готовому повідомленні й дописує NV після нього
#   displayname - змінити відображуване ім'я (якщо чат-плагін використовує {displayname})
#   off         - не чіпати чат
chat-mode: auto
